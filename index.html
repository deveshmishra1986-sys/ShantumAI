<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shantum AI</title>

  <link
    rel="stylesheet"
    href="/style.css?v=2"
  >

</head>


<body>

  <main class="dashboard">


    <!-- HEADER -->

    <header class="hero">

      <h1>
        Shantum AI
      </h1>

      <p>
        AI Agents. Rewards. Burn, Web3.
      </p>

      <button
        id="refresh-button"
        class="refresh-button"
        type="button"
      >

        <span class="refresh-icon">
          ↻
        </span>

        Refresh Data

      </button>

    </header>



    <!-- CARDS -->

    <section class="coins-grid">


      <!-- SHANTUM -->

      <div
        id="shantum-card"
        class="coin-card shantum-card"
      >

        <div class="loading">
          Loading Shantum...
        </div>

      </div>



      <!-- SHARDEUM -->

      <div
        id="shardeum-card"
        class="coin-card shardeum-card"
      >

        <div class="loading">
          Loading Shardeum...
        </div>

      </div>


    </section>



    <!-- FOOTER -->

    <footer class="dashboard-footer">

      Shantum ecosystem on Shardeum

    </footer>


  </main>



  <script src="/app.js?v=2"></script>

</body>

</html>
