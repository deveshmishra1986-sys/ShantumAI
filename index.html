<!doctype html>
<html lang="en">

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shantum & Shardeum</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>

<body>

  <main class="dashboard">

    <header class="hero">

      <h1>Shantum AI</h1>

      <p>

    </header>


    <!-- CARDS -->

    <section class="coins-grid">

      <div
        id="shantum-card"
        class="coin-card shantum-card"
      >

        <div class="loading">
          Loading Shantum...
        </div>

      </div>


      <!-- SHARDEUM -->

      <div
        id="shardeum-card"
        class="coin-card shardeum-card"
      >

        <div class="loading">
          Loading Shardeum...
        </div>

      </div>

    </section>


    <footer class="dashboard-footer">
      Shantum ecosystem on Shardeum
    </footer>

  </main>


  <script src="/app.js"></script>

</html>
