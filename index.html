<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shantum AI</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css?v=5">
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <main class="dashboard">

    <header class="hero">
      <div class="hero-badge">AI-POWERED SHARDEUM ECOSYSTEM</div>
      <h1>Shantum AI</h1>
      <p>AI Agents. Rewards. Burn, Web3.</p>

      <button id="refresh-button" class="refresh-button" type="button">
        <span class="refresh-icon">↻</span>
        Refresh Data
      </button>
    </header>

    <section class="coins-grid">

      <div id="shantum-card" class="coin-card shantum-card">
        <div class="loading">Loading Shantum...</div>
      </div>

      <div id="sikka-trades-card" class="sikka-card">
        <div class="loading">Loading Trades...</div>
      </div>

    </section>

    <section class="chart-section">
      <div class="chart-card">

        <div class="chart-header">
          <div>
            <h2>Shantum Market</h2>
            <span>STM / SHM → USD</span>
          </div>

          <div class="chart-timeframes">
            <button class="timeframe-button" data-timeframe="1m">1m</button>
            <button class="timeframe-button" data-timeframe="5m">5m</button>
            <button class="timeframe-button" data-timeframe="15m">15m</button>
            <button class="timeframe-button" data-timeframe="30m">30m</button>
            <button class="timeframe-button" data-timeframe="1h">1h</button>
            <button class="timeframe-button" data-timeframe="4h">4h</button>
            <button class="timeframe-button" data-timeframe="12h">12h</button>
            <button class="timeframe-button active" data-timeframe="24h">24h</button>
          </div>
        </div>

        <div id="stm-chart" class="stm-chart">
          <div class="chart-loading">Loading STM market data...</div>
        </div>

      </div>
    </section>

    <footer class="dashboard-footer">
      Shantum ecosystem on Shardeum
    </footer>

  </main>

  <script src="/app.js?v=5"></script>
</body>
</html>
