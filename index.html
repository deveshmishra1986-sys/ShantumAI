<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shantum AI</title>

  <link
    rel="stylesheet"
    href="/style.css?v=2"
  >

</head>


<body>

  <main class="dashboard">


    <!-- HEADER -->

    <header class="hero">

      <h1>
        Shantum AI
      </h1>

      <p>
        AI Agents. Rewards. Burn, Web3.
      </p>

      <button
        id="refresh-button"
        class="refresh-button"
        type="button"
      >

        <span class="refresh-icon">
          ↻
        </span>

        Refresh Data

      </button>

    </header>



    <!-- CARDS -->

    <section class="coins-grid">


      <!-- SHANTUM -->

      <div
        id="shantum-card"
        class="coin-card shantum-card"
      >

        <div class="loading">
          Loading Shantum...
        </div>

      </div>



      <!-- SHARDEUM -->

      <div
        id="shardeum-card"
        class="coin-card shardeum-card"
      >

        <div class="loading">
          Loading Shardeum...
        </div>

      </div>


    </section>
<!-- WALLET SECTION -->
<section class="wallet-section">

  <div class="wallet-card">

    <div class="wallet-icon">🦊</div>

    <h2>Connect Wallet</h2>

    <p class="wallet-description">
      Connect your wallet to view your STM and SHM balance.
    </p>

    <button
      id="connect-wallet"
      class="connect-wallet-button"
    >
      🦊 Connect Wallet
    </button>

    <div
      id="wallet-info"
      class="wallet-info"
      style="display: none;"
    >

      <div class="wallet-status">
        <span class="status-dot"></span>
        Connected
      </div>

      <div
        id="wallet-address"
        class="wallet-address"
      >
        0x...
      </div>

      <div class="balance-row">

        <div>
          <small>STM Balance</small>
          <strong id="wallet-stm-balance">
            0 STM
          </strong>
        </div>

        <div>
          <small>SHM Balance</small>
          <strong id="wallet-shm-balance">
            0 SHM
          </strong>
        </div>

      </div>

      <button
        id="disconnect-wallet"
        class="disconnect-wallet-button"
      >
        Disconnect
      </button>

    </div>

  </div>

</section>


    <!-- FOOTER -->

    <footer class="dashboard-footer">

      Shantum ecosystem on Shardeum

    </footer>


  </main>



  <script src="/app.js?v=2"></script>

</body>

</html>
